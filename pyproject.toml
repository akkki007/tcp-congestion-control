[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "accc"
version = "0.1.0"
description = "Adaptive Congestion Control Controller: ML-driven mid-flow TCP CC switching"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "joblib>=1.3"]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
dev = ["pytest>=7"]

[project.scripts]
accc = "accc.cli:main"

[tool.setuptools.packages.find]
include = ["accc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
